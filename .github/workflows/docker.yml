name: Test, build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/p1zzm1ssile/setuparr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r src/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(awk -F\" '/^VERSION/ {print $2}' src/app_info.py | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: setuparr:test

      - name: Check the image starts and the web UI answers
        run: |
          docker run -d --name smoke -p 9893:9893 setuparr:test
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:9893/login && break || sleep 1; done
          # A fresh install sends you to create an account, and the API needs a login
          curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" http://localhost:9893/ | tee /tmp/root
          grep -q "302 http://localhost:9893/setup" /tmp/root
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9893/api/settings)" = "401"
          docker logs smoke
          docker rm -f smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
